<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivoh Earth | MoQ Live</title>
    <script type="module" src="/src/main.ts"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 500; }
        h2 { font-size: 1rem; font-weight: 400; color: #a3a3a3; margin-bottom: 1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }
        section {
            background: #171717;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #262626;
        }
        video, canvas {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            background: #000;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            color: #525252;
            font-size: 0.875rem;
        }
        /* Room controls */
        .room-info {
            background: #171717;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .room-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .room-label {
            color: #a3a3a3;
            font-size: 0.875rem;
        }
        .room-id {
            font-family: monospace;
            font-size: 1rem;
            color: #22c55e;
            background: #052e16;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        .share-row {
            display: flex;
            gap: 0.5rem;
        }
        .share-input {
            flex: 1;
            background: #262626;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: #e5e5e5;
            font-size: 0.875rem;
            font-family: monospace;
        }
        .share-input:focus {
            outline: none;
            border-color: #525252;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 0.5rem 1rem;
            color: #e5e5e5;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #363636;
            border-color: #525252;
            transform: translateY(-1px);
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border-color: #3b82f6;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%);
            border-color: #60a5fa;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-color: #22c55e;
            color: #fff;
        }
        .btn-success:hover {
            background: linear-gradient(135deg, #22c55e 0%, #16a34a 100%);
            border-color: #22c55e;
        }

        /* Auth UI */
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #404040;
        }
        .user-name {
            color: #e5e5e5;
            font-size: 0.875rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-google {
            background: #1f1f1f;
            border-color: #333;
            color: #e5e5e5;
            padding: 0.5rem 1.25rem;
        }
        .btn-google:hover {
            background: #2a2a2a;
            border-color: #444;
        }
        .btn-google svg {
            width: 18px;
            height: 18px;
        }

        /* Footer */
        footer a {
            color: #737373;
            text-decoration: none;
        }
        footer a:hover {
            color: #a3a3a3;
            text-decoration: underline;
        }
        .support-panel {
            margin-top: 1rem;
            background: #171717;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 1rem;
            text-align: left;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        .support-panel.hidden {
            display: none;
        }

        /* Hang component button overrides */
        hang-publish button,
        hang-watch button {
            background: #262626;
            border: 1px solid #404040;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            color: #e5e5e5;
            font-size: 1.25rem;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 44px;
            min-height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        hang-publish button:hover,
        hang-watch button:hover {
            background: #363636;
            border-color: #525252;
            transform: translateY(-1px);
        }
        hang-publish button:active,
        hang-watch button:active {
            transform: translateY(0);
        }
        hang-publish div[style*="Device"],
        hang-watch div[style*="justify"] {
            color: #a3a3a3;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>vivoh.earth</h1>
            <div class="header-right">
                <div id="auth-container"></div>
                <button id="new-room-btn" class="btn btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    New Room
                </button>
            </div>
        </header>

        <div class="room-info">
            <div class="room-header">
                <span class="room-label">Room:</span>
                <span id="room-id" class="room-id">loading...</span>
            </div>
            <div class="share-row">
                <input type="text" id="share-link" class="share-input" readonly>
                <button id="copy-btn" class="btn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                    </svg>
                    Copy
                </button>
            </div>
        </div>

        <div class="grid">
            <section>
                <h2>Broadcast</h2>
                <hang-publish
                    audio
                    video
                    controls>
                    <video slot="preview" muted autoplay playsinline></video>
                </hang-publish>
            </section>

            <section>
                <h2>Watch</h2>
                <hang-watch
                    controls>
                    <canvas></canvas>
                </hang-watch>
            </section>
        </div>

        <footer>
            <p><a href="https://moq.dev/" target="_blank" rel="noopener">MoQ Transport</a> | <a href="https://blog.cloudflare.com/moq/" target="_blank" rel="noopener">Cloudflare Relay</a> | <a href="#" id="support-link">Browser Support</a></p>
            <div id="support-panel" class="support-panel hidden">
                <hang-support></hang-support>
            </div>
        </footer>
    </div>
</body>
</html>
