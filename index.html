<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vivoh Earth | MoQ Live</title>
    <script type="module" src="/src/main.ts"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0a0a;
            color: #e5e5e5;
            min-height: 100vh;
            padding: 2rem;
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header {
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 { font-size: 1.5rem; font-weight: 500; }
        h2 { font-size: 1rem; font-weight: 400; color: #a3a3a3; margin-bottom: 1rem; }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 2rem;
        }
        section {
            background: #171717;
            border-radius: 12px;
            padding: 1.5rem;
            border: 1px solid #262626;
        }
        video, canvas {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 8px;
            background: #000;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            color: #525252;
            font-size: 0.875rem;
        }
        /* Room controls */
        .room-info {
            background: #171717;
            border: 1px solid #262626;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }
        .room-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.75rem;
        }
        .room-label {
            color: #a3a3a3;
            font-size: 0.875rem;
        }
        .room-id {
            font-family: monospace;
            font-size: 1rem;
            color: #22c55e;
            background: #052e16;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
        }
        .share-row {
            display: flex;
            gap: 0.5rem;
        }
        .share-input {
            flex: 1;
            background: #262626;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 0.5rem 0.75rem;
            color: #e5e5e5;
            font-size: 0.875rem;
            font-family: monospace;
        }
        .share-input:focus {
            outline: none;
            border-color: #525252;
        }
        .btn {
            background: #262626;
            border: 1px solid #404040;
            border-radius: 6px;
            padding: 0.5rem 1rem;
            color: #e5e5e5;
            font-size: 0.875rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover {
            background: #363636;
        }
        .btn-primary {
            background: #1d4ed8;
            border-color: #1d4ed8;
        }
        .btn-primary:hover {
            background: #2563eb;
        }

        /* Auth UI */
        .header-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid #404040;
        }
        .user-name {
            color: #e5e5e5;
            font-size: 0.875rem;
            max-width: 120px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .btn-google {
            display: flex;
            align-items: center;
            background: #fff;
            color: #333;
            border-color: #ddd;
        }
        .btn-google:hover {
            background: #f5f5f5;
        }

        /* Footer */
        footer a {
            color: #737373;
            text-decoration: none;
        }
        footer a:hover {
            color: #a3a3a3;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>vivoh.earth</h1>
            <div class="header-right">
                <div id="auth-container"></div>
                <button id="new-room-btn" class="btn btn-primary">+ New Room</button>
            </div>
        </header>

        <div class="room-info">
            <div class="room-header">
                <span class="room-label">Room:</span>
                <span id="room-id" class="room-id">loading...</span>
            </div>
            <div class="share-row">
                <input type="text" id="share-link" class="share-input" readonly>
                <button id="copy-btn" class="btn">Copy</button>
            </div>
        </div>

        <div class="grid">
            <section>
                <h2>Broadcast</h2>
                <hang-publish
                    audio
                    video
                    controls>
                    <video slot="preview" muted autoplay playsinline></video>
                </hang-publish>
            </section>

            <section>
                <h2>Watch</h2>
                <hang-watch
                    controls>
                    <canvas></canvas>
                </hang-watch>
            </section>
        </div>

        <footer>
            <p><a href="https://moq.dev/" target="_blank" rel="noopener">MoQ Transport</a> | <a href="https://blog.cloudflare.com/moq/" target="_blank" rel="noopener">Cloudflare Relay</a> | <a href="https://caniuse.com/webtransport" target="_blank" rel="noopener">Browser Support</a></p>
        </footer>
    </div>
</body>
</html>
